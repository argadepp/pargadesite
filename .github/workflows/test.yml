name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      version:
        description: "Enter application version"
        required: true
        type: string
        default: "latest"

      deploy:
        description: "Deploy application?"
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show inputs
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"
          echo "Deploy: ${{ inputs.deploy }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        if: ${{ inputs.deploy }}
        run: |
          echo "Deploying version ${{ inputs.version }}"
          echo "Target environment: ${{ inputs.environment }}"

          # Add your deployment commands here
          # Example:
          # terraform apply ...
          # helm upgrade ...
          # kubectl apply ...
