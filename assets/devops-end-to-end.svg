<rect x="55" y="520" width="1490" height="315" rx="22" fill="#111d2b" stroke="#285849" stroke-width="2"/><text x="85" y="563" fill="#7ee7bd" font-family="Arial,sans-serif" font-size="21" font-weight="700">CONTINUOUS DELIVERY / DEPLOYMENT · JENKINS CD + KUBERNETES</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="115" y="615" width="250" height="145" rx="18" fill="url(#green)" stroke="#58d6a4" stroke-width="2"/><text x="240" y="657" fill="#7ee7bd" font-size="17" font-weight="700">07 · CONTAINER REGISTRY</text><text x="240" y="697" fill="#fff" font-size="23" font-weight="700">Docker Hub / ECR</text><text x="240" y="729" fill="#c5e8dc" font-size="16">Store versioned image</text>
<rect x="475" y="615" width="250" height="145" rx="18" fill="url(#green)" stroke="#58d6a4" stroke-width="2"/><text x="600" y="657" fill="#7ee7bd" font-size="17" font-weight="700">08 · DEPLOY</text><text x="600" y="697" fill="#fff" font-size="23" font-weight="700">Jenkins CD</text><text x="600" y="729" fill="#c5e8dc" font-size="16">Helm / kubectl rollout</text>
<rect x="835" y="615" width="250" height="145" rx="18" fill="url(#blue)" stroke="#5b9bd5" stroke-width="2"/><text x="960" y="657" fill="#79c0ff" font-size="17" font-weight="700">09 · RUNTIME</text><text x="960" y="697" fill="#fff" font-size="23" font-weight="700">Kubernetes</text><text x="960" y="729" fill="#c7d6e6" font-size="16">Pods · Service · Ingress</text>
<rect x="1195" y="615" width="290" height="145" rx="18" fill="url(#blue)" stroke="#5b9bd5" stroke-width="2"/><text x="1340" y="657" fill="#79c0ff" font-size="17" font-weight="700">10 · OPERATE</text><text x="1340" y="697" fill="#fff" font-size="23" font-weight="700">Users + monitoring</text><text x="1340" y="729" fill="#c7d6e6" font-size="16">Prometheus · Grafana · Logs</text>
</g>
