<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">End-to-end DevOps CI/CD lifecycle using Jenkins</title><desc id="desc">A developer commits code to GitHub. A webhook triggers Jenkins. Jenkins checks out code, builds, tests and scans it, builds a Docker image and pushes it to a registry. Jenkins deploys the image to Kubernetes. Users access the app while Prometheus, Grafana and logs monitor it and feed back to the team.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#0b1420"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#1d4267"/><stop offset="1" stop-color="#14283e"/></linearGradient><linearGradient id="green" x2="1" y2="1"><stop stop-color="#174b43"/><stop offset="1" stop-color="#12352f"/></linearGradient><linearGradient id="orange" x2="1" y2="1"><stop stop-color="#65401f"/><stop offset="1" stop-color="#392817"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#80bfff"/></marker><marker id="greenArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58d6a4"/></marker></defs>
<rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="70" y="72" fill="#79c0ff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">THE COMPLETE DEVOPS DELIVERY LOOP</text><text x="70" y="118" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="34" font-weight="700">From developer commit to monitored production</text>
<rect x="55" y="155" width="1490" height="325" rx="22" fill="#111d2b" stroke="#30445c" stroke-width="2"/><text x="85" y="198" fill="#ffbd75" font-family="Arial,sans-serif" font-size="21" font-weight="700">CONTINUOUS INTEGRATION · JENKINS CI</text>
<!-- top nodes -->
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="85" y="245" width="185" height="145" rx="18" fill="url(#blue)" stroke="#5b9bd5" stroke-width="2"/><text x="177" y="287" fill="#79c0ff" font-size="17" font-weight="700">01 · DEVELOPER</text><text x="177" y="326" fill="#fff" font-size="23" font-weight="700">Code + commit</text><text x="177" y="357" fill="#c7d6e6" font-size="16">git add / commit</text><text x="177" y="379" fill="#c7d6e6" font-size="16">git push</text>
<rect x="335" y="245" width="185" height="145" rx="18" fill="url(#blue)" stroke="#5b9bd5" stroke-width="2"/><text x="427" y="287" fill="#79c0ff" font-size="17" font-weight="700">02 · SOURCE CONTROL</text><text x="427" y="326" fill="#fff" font-size="23" font-weight="700">GitHub</text><text x="427" y="357" fill="#c7d6e6" font-size="16">Repository / branch</text><text x="427" y="379" fill="#c7d6e6" font-size="16">Pull request</text>
<rect x="585" y="245" width="185" height="145" rx="18" fill="url(#orange)" stroke="#d99a58" stroke-width="2"/><text x="677" y="287" fill="#ffbd75" font-size="17" font-weight="700">03 · EVENT</text><text x="677" y="326" fill="#fff" font-size="23" font-weight="700">Webhook</text><text x="677" y="357" fill="#e5d5c5" font-size="16">Push / PR event</text><text x="677" y="379" fill="#e5d5c5" font-size="16">Notifies Jenkins</text>
<rect x="835" y="245" width="185" height="145" rx="18" fill="url(#orange)" stroke="#d99a58" stroke-width="2"/><text x="927" y="287" fill="#ffbd75" font-size="17" font-weight="700">04 · ORCHESTRATOR</text><text x="927" y="326" fill="#fff" font-size="23" font-weight="700">Jenkins</text><text x="927" y="357" fill="#e5d5c5" font-size="16">Controller schedules</text><text x="927" y="379" fill="#e5d5c5" font-size="16">pipeline on an agent</text>
<rect x="1085" y="245" width="185" height="145" rx="18" fill="url(#orange)" stroke="#d99a58" stroke-width="2"/><text x="1177" y="287" fill="#ffbd75" font-size="17" font-weight="700">05 · JENKINS AGENT</text><text x="1177" y="326" fill="#fff" font-size="23" font-weight="700">Build + test</text><text x="1177" y="357" fill="#e5d5c5" font-size="16">Checkout · compile</text><text x="1177" y="379" fill="#e5d5c5" font-size="16">Unit test · quality scan</text>
<rect x="1335" y="245" width="175" height="145" rx="18" fill="url(#green)" stroke="#58d6a4" stroke-width="2"/><text x="1422" y="287" fill="#7ee7bd" font-size="17" font-weight="700">06 · PACKAGE</text><text x="1422" y="326" fill="#fff" font-size="23" font-weight="700">Docker image</text><text x="1422" y="357" fill="#c5e8dc" font-size="16">Build + tag</text><text x="1422" y="379" fill="#c5e8dc" font-size="16">Scan image</text>
</g>
