<path d="M1340 770V795H600V770" fill="none" stroke="#79c0ff" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="970" y="821" fill="#9acbff" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Feedback loop: alerts, metrics and logs help the team improve the next release</text>
</svg>