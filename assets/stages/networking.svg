<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Networking Fundamentals visual workflow</title><desc id="d">Trace how a request reaches an application: BROWSER to DNS to IP + PORT to HTTP / HTTPS.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f30"/><stop offset="1" stop-color="#0b1420"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79c0ff"/></marker></defs><rect width="1200" height="520" rx="26" fill="url(#bg)"/><text x="70" y="78" fill="#79c0ff" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">DEVOPS LEARNING ROADMAP · VISUAL GUIDE</text><text x="70" y="135" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="34" font-weight="700">Networking Fundamentals</text><text x="70" y="174" fill="#aebfd1" font-family="Arial,sans-serif" font-size="19">Trace how a request reaches an application</text><path d="M293 290h52" stroke="#79c0ff" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M573 290h52" stroke="#79c0ff" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M853 290h52" stroke="#79c0ff" stroke-width="4" fill="none" marker-end="url(#arr)"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="75" y="215" width="210" height="150" rx="18" fill="#15263a" stroke="#79c0ff" stroke-opacity=".72" stroke-width="2"/><circle cx="180" cy="250" r="17" fill="#79c0ff" fill-opacity=".17" stroke="#79c0ff" stroke-width="1.5"/><text x="180" y="256" fill="#79c0ff" font-size="15" font-weight="700">01</text><text x="180" y="298" fill="#f0f6fc" font-size="17" font-weight="700">BROWSER</text><text x="180" y="330" fill="#aebfd1" font-size="15">Request URL</text></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="355" y="215" width="210" height="150" rx="18" fill="#15263a" stroke="#79c0ff" stroke-opacity=".72